name: deploy-to-aks

# Builds the app image for linux/arm64 (the AKS node pool runs Ampere ARM VMs),
# pushes it to ACR tagged with the commit SHA, then deploys the manifests
# which live at the repository root.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrdevopsnir
  AKS_CLUSTER: devopscluster
  AKS_RESOURCE_GROUP: aks-devops-project
  IMAGE_NAME: web-app
  NAMESPACE: aks-devops

jobs:
  build:
    name: Build and push to ACR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image reference
        id: meta
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "image=${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      # QEMU lets this amd64 runner build an arm64 image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - name: Build and push (arm64)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag "${{ steps.meta.outputs.image }}" \
            --push \
            ./app

  deploy:
    name: Deploy to AKS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}

      - name: Apply manifests
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          echo "Deploying image: $IMAGE"
          kubectl apply -f 00-namespace.yml
          kubectl apply -f 01-configmap.yml
          envsubst '${IMAGE}' < 02-deployment.yml | kubectl apply -f -
          kubectl apply -f 03-service.yml
          kubectl apply -f 04-hpa.yml

      - name: Wait for rollout
        run: kubectl rollout status deployment/web-app -n "$NAMESPACE" --timeout=180s

      - name: Show cluster state
        run: |
          kubectl get deploy,pods,svc,hpa -n "$NAMESPACE" -o wide
          echo "--- running image ---"
          kubectl get deploy web-app -n "$NAMESPACE" -o jsonpath='{..image}{"\n"}'
          echo "--- rollout history ---"
          kubectl rollout history deployment/web-app -n "$NAMESPACE"

      - name: Publish app URL
        run: |
          IP=$(kubectl get svc web-service -n "$NAMESPACE" \
                 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "### App URL: http://${IP:-pending}" >> "$GITHUB_STEP_SUMMARY"
